<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>叫びマーモット</title>
<style>
@font-face {
  font-family: 'Chikara';
  src: url('/marmot/851CHIKARA-DZUYOKU_kanaA_004.ttf') format('truetype');
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #f5f5f0; font-family: 'Chikara', sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px 16px 48px; }
h1 { font-size: 28px; color: #1a1a1a; margin-bottom: 4px; letter-spacing: 3px; }
.sub { font-size: 13px; color: #888; margin-bottom: 18px; font-family: sans-serif; }
.input-area { width: 100%; max-width: 600px; margin-bottom: 14px; }
input[type=text] {
  width: 100%; font-size: 20px; font-family: 'Chikara', sans-serif;
  padding: 12px 16px; border: 2px solid #ccc; border-radius: 10px;
  outline: none; background: #fff; color: #1a1a1a;
}
input[type=text]:focus { border-color: #333; }
.char-hint { font-size: 12px; color: #aaa; text-align: right; margin-top: 4px; font-family: sans-serif; }
.canvas-wrap { width: 100%; max-width: 600px; border-radius: 12px; overflow: hidden; border: 1px solid #ddd; background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,0.1); }
canvas { width: 100%; display: block; }
.btn-row { display: flex; gap: 10px; margin-top: 14px; width: 100%; max-width: 600px; flex-wrap: wrap; }
button {
  flex: 1; min-width: 120px; padding: 13px; font-size: 15px; font-family: 'Chikara', sans-serif;
  border-radius: 10px; cursor: pointer; transition: all 0.15s;
}
.btn-dl { background: #1a1a1a; color: #fff; border: none; }
.btn-dl:hover { background: #333; }
.btn-copy { background: #fff; color: #1a1a1a; border: 2px solid #222; }
.btn-copy:hover { background: #f0f0f0; }
.btn-x { background: #000; color: #fff; border: none; }
.btn-x:hover { background: #222; }
.toast {
  position: fixed; bottom: 32px; left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: #1a1a1a; color: #fff; padding: 12px 24px;
  border-radius: 8px; font-size: 14px; font-family: sans-serif;
  opacity: 0; transition: all 0.2s; pointer-events: none; z-index: 200;
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<h1>叫びマーモット</h1>
<p class="sub">マーモットに叫ばせよう</p>
<div class="input-area">
  <input type="text" id="txt" maxlength="30" placeholder="叫ばせたい言葉を入力…" oninput="draw()">
  <div class="char-hint" id="cnt">0 / 30</div>
</div>
<div class="canvas-wrap">
  <canvas id="c"></canvas>
</div>
<div class="btn-row">
  <button class="btn-dl" onclick="dl()">💾 画像を保存</button>
  <button class="btn-x" onclick="shareX()">𝕏 Xでシェア</button>
</div>

<div class="toast" id="toast"></div>

const img = new Image();
let ready = false;
img.onload = () => { ready = true; draw(); };
img.src = IMG_SRC;

const BUBBLE = { cx: 0.672, cy: 0.475, w: 0.60, h: 0.72 };

function draw() {
  const txt = document.getElementById('txt').value;
  document.getElementById('cnt').textContent = txt.length + ' / 30';
  savedFlag = false; // 入力変更でフラグリセット
  if (!ready) return;
  const CW = 600, CH = Math.round(600 * 1024 / 1536);
  const c = document.getElementById('c');
  c.width = CW; c.height = CH;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, CW, CH);
  ctx.drawImage(img, 0, 0, CW, CH);
  if (!txt) return;
  const bcx = CW * BUBBLE.cx;
  const bcy = CH * BUBBLE.cy;
  const bw  = CW * BUBBLE.w * 0.78;
  const bh  = CH * BUBBLE.h * 0.65;
  const lines = splitLines(txt, bw, bh, ctx);
  const lh = lines.fs * 1.25;
  const totalH = lh * lines.arr.length;
  ctx.font = `${lines.fs}px 'Chikara', sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  lines.arr.forEach((line, i) => {
    const y = bcy - totalH/2 + lh*i + lh/2;
    ctx.lineWidth = lines.fs * 0.12;
    ctx.strokeStyle = '#fff';
    ctx.strokeText(line, bcx, y);
    ctx.fillStyle = '#111';
    ctx.fillText(line, bcx, y);
  });
}

function splitLines(txt, maxW, maxH, ctx) {
  for (let fs = 72; fs >= 24; fs -= 4) {
    ctx.font = `${fs}px 'Chikara', sans-serif`;
    const lh = fs * 1.25;
    if (ctx.measureText(txt).width <= maxW && lh <= maxH) return { arr: [txt], fs };
    const m = Math.ceil(txt.length/2);
    const l1 = txt.slice(0,m), l2 = txt.slice(m);
    if (Math.max(ctx.measureText(l1).width, ctx.measureText(l2).width) <= maxW && lh*2 <= maxH) return { arr: [l1,l2], fs };
    const a = Math.ceil(txt.length/3);
    const r1=txt.slice(0,a), r2=txt.slice(a,a*2), r3=txt.slice(a*2);
    if (Math.max(ctx.measureText(r1).width,ctx.measureText(r2).width,ctx.measureText(r3).width) <= maxW && lh*3 <= maxH) return { arr:[r1,r2,r3], fs };
  }
  return { arr:[txt.slice(0,15)+'…'], fs:24 };
}

let savedFlag = false;

function dl() {
  draw();
  const link = document.createElement('a');
  link.download = 'marmot-scream.png';
  link.href = document.getElementById('c').toDataURL('image/png');
  link.click();
  savedFlag = true;
}

// Xでシェア：未保存なら先にダウンロード → X投稿画面を開く
function shareX() {
  if (!savedFlag) {
    dl();
    setTimeout(() => openX(), 400);
  } else {
    openX();
  }
}

function openX() {
  const url = 'https://x.com/intent/tweet?text=' + encodeURIComponent('#叫びマーモット');
  window.open(url, '_blank');
  toast('ダウンロードした画像をXに添付してね');
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3000);
}
</script>
