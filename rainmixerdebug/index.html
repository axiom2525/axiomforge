<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雨音ミキサー デバッグ</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: monospace; background: #111; color: #ddd; font-size: 13px; }
h1 { color: #7cf; padding: 12px 16px 8px; font-size: 15px; border-bottom: 1px solid #333; }
.grid-header {
  display: grid;
  grid-template-columns: 1fr 80px 90px 70px 80px;
  gap: 4px; padding: 6px 8px;
  background: #1a1a1a; color: #666; font-size: 11px;
  border-bottom: 1px solid #333;
  position: sticky; top: 0; z-index: 10;
}
.row {
  display: grid;
  grid-template-columns: 1fr 80px 90px 70px 80px;
  gap: 4px; padding: 8px 8px;
  border-bottom: 1px solid #1e1e1e;
  align-items: center;
}
.row.playing { background: #0a1a0a; }
.info { min-width: 0; }
.fname { color: #7af; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.desc { color: #888; font-size: 11px; margin-top: 2px; }
.level { text-align: center; font-size: 11px; }
.lvl-5{color:#0f0} .lvl-4{color:#9f0} .lvl-3{color:#ff0} .lvl-2{color:#f90} .lvl-1{color:#f44}
input[type=range] { width: 80px; accent-color: #7cf; }
.vol-num { color: #7cf; font-size: 13px; text-align: center; }
.dot { color: #0f0; }
select { background:#222; color:#aaa; border:1px solid #444; padding:3px 2px; font-size:11px; border-radius:3px; width:76px; }
</style>
</head>
<body>
<h1>🌧 雨音ミキサー デバッグ</h1>
<div class="grid-header">
  <div>ファイル / 説明</div>
  <div style="text-align:center">レベル</div>
  <div style="text-align:center">音量</div>
  <div style="text-align:center">値</div>
  <div>ランダム</div>
</div>
<div id="rows"></div>

<script>
const BASE = '/rainmixerdebug/';
const FADE = 2.0; // クロスフェード秒数

const files = [
  {f:'Firefly_audio_gusty_wind_sound_variation1.wav',d:'突風・強風 v1',lv:4},
  {f:'Firefly_audio_light_rain_falling_softly,_gentle_raindrops,_natur_variation1.wav',d:'やさしい雨 v1',lv:3},
  {f:'Firefly_audio_light_rain_falling_softly,_gentle_raindrops,_natur_variation2.wav',d:'やさしい雨 v2',lv:2},
  {f:'Firefly_audio_light_rain_falling_softly,_gentle_raindrops,_natur_variation3.wav',d:'やさしい雨 v3',lv:4},
  {f:'Firefly_audio_light_rain_falling_softly,_gentle_raindrops,_natur_variation4.wav',d:'やさしい雨 v4',lv:2},
  {f:'Firefly_audio_rain_hitting_asphalt_sound_variation1.wav',d:'アスファルト v1',lv:5},
  {f:'Firefly_audio_rain_hitting_asphalt_sound_variation2.wav',d:'アスファルト v2',lv:4},
  {f:'Firefly_audio_rain_hitting_metal_roof_sound_variation1.wav',d:'金属屋根 v1',lv:5},
  {f:'Firefly_audio_rain_hitting_metal_roof_sound_variation2.wav',d:'金属屋根 v2',lv:3},
  {f:'Firefly_audio_rain_hitting_puddles_sound_variation1.wav',d:'水たまり v1',lv:5},
  {f:'Firefly_audio_rain_hitting_puddles_sound_variation2.wav',d:'水たまり v2',lv:4},
  {f:'Firefly_audio_rain_hitting_puddles_sound_variation3.wav',d:'水たまり v3',lv:2},
  {f:'Firefly_audio_rain_hitting_tent_fabric_sound_variation1.wav',d:'テント v1',lv:5},
  {f:'Firefly_audio_rain_hitting_tent_fabric_sound_variation3.wav',d:'テント v3',lv:3},
  {f:'Firefly_audio_sound_of_thunder_variation1.wav',d:'遠雷 v1',lv:5},
  {f:'Firefly_audio_sound_of_thunder_variation2.wav',d:'遠雷 v2',lv:4},
  {f:'Firefly_audio_thunderclap_variation1.wav',d:'雷鳴 v1',lv:5},
  {f:'Firefly_audio_thunderclap_variation2.wav',d:'雷鳴 v2',lv:3},
  {f:'Firefly_audio_thunderclap_variation3.wav',d:'雷鳴 v3',lv:2},
  {f:'Firefly_audio_whistling_wind_sound_variation1.wav',d:'ヒュー風 v1',lv:5},
  {f:'Firefly_audio_whistling_wind_sound_variation4.wav',d:'ヒュー風 v4',lv:4},
];

const RAND_SEC = [0,30,60,90,120,180];
const RAND_LBL = ['0(なし)','1(30s)','2(60s)','3(90s)','4(2m)','5(3m)'];

// Web Audio APIでクロスフェード対応
let actx = null;
function getCtx() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  return actx;
}

// 各トラックの状態
const tracks = files.map(() => ({
  audioA: null, audioB: null,
  gainA: null, gainB: null,
  sourceA: null, sourceB: null,
  vol: 0, rand: 0, randTimer: null,
  active: 'A', fadeTimer: null
}));

function lvC(n){return['','lvl-1','lvl-2','lvl-3','lvl-4','lvl-5'][n];}

function build() {
  const c = document.getElementById('rows');
  files.forEach((it, i) => {
    const row = document.createElement('div');
    row.className = 'row'; row.id = 'r'+i;
    const stars = '★'.repeat(it.lv)+'☆'.repeat(5-it.lv);
    row.innerHTML = `
      <div class="info">
        <div class="fname" title="${it.f}">${it.f}</div>
        <div class="desc">${it.d}</div>
      </div>
      <div class="level ${lvC(it.lv)}">${stars}</div>
      <input type="range" min="0" max="100" value="0" id="s${i}" oninput="setVol(${i},+this.value)">
      <div class="vol-num" id="n${i}">0<span class="dot" id="d${i}" style="display:none">▶</span></div>
      <select onchange="setRand(${i},+this.value)">
        ${RAND_LBL.map((l,v)=>`<option value="${v}">${l}</option>`).join('')}
      </select>`;
    c.appendChild(row);
  });
}

function getOrCreateTrack(i) {
  const t = tracks[i];
  const ctx = getCtx();
  const url = BASE + files[i].f;

  function makeAudio(gain) {
    const a = new Audio(url);
    a.loop = false;
    a.crossOrigin = 'anonymous';
    const src = ctx.createMediaElementSource(a);
    src.connect(gain);
    return a;
  }

  if (!t.gainA) {
    t.gainA = ctx.createGain(); t.gainA.gain.value = 0; t.gainA.connect(ctx.destination);
    t.gainB = ctx.createGain(); t.gainB.gain.value = 0; t.gainB.connect(ctx.destination);
    t.audioA = makeAudio(t.gainA);
    t.audioB = makeAudio(t.gainB);

    // ループクロスフェード
    t.audioA.addEventListener('timeupdate', () => scheduleXfade(i, 'A'));
    t.audioB.addEventListener('timeupdate', () => scheduleXfade(i, 'B'));
  }
  return t;
}

function scheduleXfade(i, which) {
  const t = tracks[i];
  if (t.vol === 0) return;
  if (t.active !== which) return;
  const audio = which === 'A' ? t.audioA : t.audioB;
  if (!audio.duration || audio.duration <= 0) return;
  const remaining = audio.duration - audio.currentTime;
  if (remaining > FADE || remaining <= 0) return;

  // クロスフェード開始
  const ctx = getCtx();
  const target = which === 'A' ? 'B' : 'A';
  const audioNext = target === 'A' ? t.audioA : t.audioB;
  const gainCur = which === 'A' ? t.gainA : t.gainB;
  const gainNext = target === 'A' ? t.gainA : t.gainB;
  const vol = t.vol / 100;

  // 次のオーディオを頭から再生
  audioNext.currentTime = 0;
  audioNext.play().catch(()=>{});
  gainNext.gain.setValueAtTime(0, ctx.currentTime);
  gainNext.gain.linearRampToValueAtTime(vol, ctx.currentTime + remaining);
  gainCur.gain.setValueAtTime(vol, ctx.currentTime);
  gainCur.gain.linearRampToValueAtTime(0, ctx.currentTime + remaining);

  t.active = target;
}

function setVol(i, v) {
  tracks[i].vol = v;
  document.getElementById('n'+i).firstChild.nodeValue = v;
  const ctx = getCtx();
  const t = getOrCreateTrack(i);
  const gainCur = t.active === 'A' ? t.gainA : t.gainB;
  const audioCur = t.active === 'A' ? t.audioA : t.audioB;

  gainCur.gain.cancelScheduledValues(ctx.currentTime);
  gainCur.gain.setValueAtTime(v/100, ctx.currentTime);

  if (v >= 1) {
    if (audioCur.paused) audioCur.play().catch(()=>{});
    document.getElementById('d'+i).style.display = 'inline';
    document.getElementById('r'+i).classList.add('playing');
  } else {
    t.audioA.pause(); t.audioA.currentTime = 0;
    t.audioB.pause(); t.audioB.currentTime = 0;
    t.gainA.gain.setValueAtTime(0, ctx.currentTime);
    t.gainB.gain.setValueAtTime(0, ctx.currentTime);
    t.active = 'A';
    document.getElementById('d'+i).style.display = 'none';
    document.getElementById('r'+i).classList.remove('playing');
  }
}

function setRand(i, v) {
  const t = tracks[i];
  t.rand = v;
  if (t.randTimer) { clearInterval(t.randTimer); t.randTimer = null; }
  if (!v) return;
  t.randTimer = setInterval(() => fireRand(i), RAND_SEC[v]*1000);
}

function fireRand(i) {
  if (tracks[i].vol > 0) return;
  const t = getOrCreateTrack(i);
  const ctx = getCtx();
  const gain = t.gainA;
  const audio = t.audioA;
  audio.currentTime = 0;
  gain.gain.setValueAtTime(0, ctx.currentTime);
  gain.gain.linearRampToValueAtTime(0.6, ctx.currentTime + 1.0);
  audio.play().catch(()=>{});
  setTimeout(() => {
    if (tracks[i].vol === 0) {
      gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 2.0);
      setTimeout(() => { if(tracks[i].vol===0) audio.pause(); }, 2500);
    }
  }, 6000);
}

build();
</script>
</body>
</html>
