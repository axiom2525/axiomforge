<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雨音ミキサー デバッグ</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: monospace; background: #111; color: #ddd; font-size: 13px; }
h1 { color: #7cf; padding: 12px 16px 8px; font-size: 15px; border-bottom: 1px solid #333; }
.grid-header {
  display: grid; grid-template-columns: 1fr 80px 90px 70px 80px;
  gap: 4px; padding: 6px 8px; background: #1a1a1a; color: #666; font-size: 11px;
  border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 10;
}
.row {
  display: grid; grid-template-columns: 1fr 80px 90px 70px 80px;
  gap: 4px; padding: 8px 8px; border-bottom: 1px solid #1e1e1e; align-items: center;
}
.row.playing { background: #0a1a0a; }
.info { min-width: 0; }
.fname { color: #7af; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.desc { color: #888; font-size: 11px; margin-top: 2px; }
.level { text-align: center; font-size: 11px; }
.lvl-5{color:#0f0} .lvl-4{color:#9f0} .lvl-3{color:#ff0} .lvl-2{color:#f90} .lvl-1{color:#f44}
input[type=range] { width: 80px; accent-color: #7cf; }
.vol-num { color: #7cf; font-size: 13px; text-align: center; }
.dot { color: #0f0; }
select { background:#222; color:#aaa; border:1px solid #444; padding:3px 2px; font-size:11px; border-radius:3px; width:76px; }
</style>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5808591005205512"
     crossorigin="anonymous"></script>
</head>
<body>
<h1>🌧 雨音ミキサー デバッグ ver0.03</h1>
<div class="grid-header">
  <div>ファイル / 説明</div>
  <div style="text-align:center">レベル</div>
  <div style="text-align:center">音量</div>
  <div style="text-align:center">値</div>
  <div>インターバル</div>
</div>
<div id="rows"></div>

<script>
const BASE = '/rainmixerdebug/';
const FADE_SEC = 3.0;
const FADE_STEP = 50;

const files = [
  {f:'Firefly_audio_gusty_wind_sound_variation1.wav',d:'突風・強風 v1',lv:4},
  {f:'Firefly_audio_light_rain_falling_softly,_gentle_raindrops,_natur_variation1.wav',d:'やさしい雨 v1',lv:3},
  {f:'Firefly_audio_light_rain_falling_softly,_gentle_raindrops,_natur_variation2.wav',d:'やさしい雨 v2',lv:2},
  {f:'Firefly_audio_light_rain_falling_softly,_gentle_raindrops,_natur_variation3.wav',d:'やさしい雨 v3',lv:4},
  {f:'Firefly_audio_light_rain_falling_softly,_gentle_raindrops,_natur_variation4.wav',d:'やさしい雨 v4',lv:2},
  {f:'Firefly_audio_heavy_rain,_dense_rainfall,_no_wind,_no_thunder,_i_variation2.wav',d:'やや強い雨',lv:4},
  {f:'Firefly_audio_heavy_rain,_dense_rainfall,_no_wind,_no_thunder,_i_variation4.wav',d:'強い雨',lv:4},
  {f:'Firefly_audio_rain_hitting_asphalt_sound_variation1.wav',d:'アスファルト v1',lv:5},
  {f:'Firefly_audio_rain_hitting_asphalt_sound_variation2.wav',d:'アスファルト v2',lv:4},
  {f:'Firefly_audio_rain_hitting_metal_roof_sound_variation1.wav',d:'金属屋根 v1',lv:5},
  {f:'Firefly_audio_rain_hitting_metal_roof_sound_variation2.wav',d:'金属屋根 v2',lv:3},
  {f:'Firefly_audio_rain_hitting_puddles_sound_variation1.wav',d:'水たまり v1',lv:5},
  {f:'Firefly_audio_rain_hitting_puddles_sound_variation2.wav',d:'水たまり v2',lv:4},
  {f:'Firefly_audio_rain_hitting_puddles_sound_variation3.wav',d:'水たまり v3',lv:2},
  {f:'Firefly_audio_rain_hitting_tent_fabric_sound_variation1.wav',d:'テント v1',lv:5},
  {f:'Firefly_audio_rain_hitting_tent_fabric_sound_variation3.wav',d:'テント v3',lv:3},
  {f:'Firefly_audio_isolated_frog_croaking,_distant,_minimal_ambient_n_variation1.wav',d:'カエル v1',lv:3},
  {f:'Firefly_audio_isolated_frog_croaking,_distant,_minimal_ambient_n_variation2.wav',d:'カエル v2',lv:3},
  {f:'Firefly_audio_sound_of_thunder_variation1.wav',d:'遠雷 v1',lv:5},
  {f:'Firefly_audio_sound_of_thunder_variation2.wav',d:'遠雷 v2',lv:4},
  {f:'Firefly_audio_thunderclap_variation1.wav',d:'雷鳴 v1',lv:5},
  {f:'Firefly_audio_thunderclap_variation2.wav',d:'雷鳴 v2',lv:3},
  {f:'Firefly_audio_thunderclap_variation3.wav',d:'雷鳴 v3',lv:2},
  {f:'Firefly_audio_whistling_wind_sound_variation1.wav',d:'ヒュー風 v1',lv:5},
  {f:'Firefly_audio_whistling_wind_sound_variation4.wav',d:'ヒュー風 v4',lv:4},
];

// インターバル: なし/10s/20s/30s/60s/90s
const INTV_SEC = [0, 10, 20, 30, 60, 90];
const INTV_LBL = ['なし','10秒','20秒','30秒','60秒','90秒'];

const tracks = files.map(it => {
  const url = BASE + it.f;
  const a = new Audio(url);
  const b = new Audio(url);
  a.preload = b.preload = 'auto';
  return { a, b, active:'a', vol:0, intv:0, intvTimer:null, fading:false, fadeTimer:null, playing:false };
});

function lvC(n){return['','lvl-1','lvl-2','lvl-3','lvl-4','lvl-5'][n];}

function build() {
  const c = document.getElementById('rows');
  files.forEach((it,i) => {
    const row = document.createElement('div');
    row.className='row'; row.id='r'+i;
    const stars='★'.repeat(it.lv)+'☆'.repeat(5-it.lv);
    row.innerHTML=`
      <div class="info">
        <div class="fname" title="${it.f}">${it.f}</div>
        <div class="desc">${it.d}</div>
      </div>
      <div class="level ${lvC(it.lv)}">${stars}</div>
      <input type="range" min="0" max="100" value="0" id="s${i}" oninput="setVol(${i},+this.value)">
      <div class="vol-num" id="n${i}">0<span class="dot" id="d${i}" style="display:none">▶</span></div>
      <select id="intv${i}" onchange="setIntv(${i},+this.value)">
        ${INTV_LBL.map((l,v)=>`<option value="${v}">${l}</option>`).join('')}
      </select>`;
    c.appendChild(row);

    // ended イベントでインターバル待機開始
    tracks[i].a.addEventListener('ended', ()=>onEnded(i));
    tracks[i].b.addEventListener('ended', ()=>onEnded(i));
  });

  // setIntervalで全トラックのクロスフェードタイミングを監視（timeupdateより精度高い）
  setInterval(() => {
    tracks.forEach((t, i) => {
      checkXfade(i, t.active);
    });
  }, 100);
}

// インターバル再生が終わったら待機→再生サイクル
function onEnded(i) {
  const t = tracks[i];
  if (t.intv === 0) return;
  t.intvTimer = setTimeout(() => playOnce(i), INTV_SEC[t.intv] * 1000);
}

// インターバル1回再生（ループなし、vol値で再生）
function playOnce(i) {
  const t = tracks[i];
  if (t.intv === 0) return;
  // ループ停止
  stopLoop(i);
  const a = t.a;
  a.currentTime = 0;
  a.volume = t.vol / 100;
  a.play().catch(()=>{});
}

// ループ停止（クロスフェード中断）
function stopLoop(i) {
  const t = tracks[i];
  if (t.fadeTimer) { clearInterval(t.fadeTimer); t.fadeTimer = null; }
  t.fading = false;
  t.b.pause(); t.b.currentTime = 0; t.b.volume = 0;
  t.active = 'a';
}

function checkXfade(i, which) {
  const t = tracks[i];
  if (t.vol === 0 || t.fading || t.intv > 0) return;
  if (t.active !== which) return;
  const cur = which==='a' ? t.a : t.b;
  const nxt = which==='a' ? t.b : t.a;
  if (!cur.duration || cur.duration === Infinity) return;
  const rem = cur.duration - cur.currentTime;
  if (rem > FADE_SEC || rem <= 0) return;

  t.fading = true;
  nxt.currentTime = 0;
  nxt.volume = 0;
  nxt.play().catch(()=>{});

  const targetVol = t.vol / 100;
  const steps = Math.ceil(rem * 1000 / FADE_STEP);
  let step = 0;
  t.fadeTimer = setInterval(() => {
    step++;
    const prog = Math.min(step / steps, 1);
    const angle = prog * Math.PI / 2;
    cur.volume = targetVol * Math.cos(angle);
    nxt.volume = targetVol * Math.sin(angle);
    if (prog >= 1) {
      clearInterval(t.fadeTimer);
      cur.pause(); cur.currentTime = 0; cur.volume = 0;
      t.active = which==='a' ? 'b' : 'a';
      t.fading = false;
    }
  }, FADE_STEP);
}

function setVol(i, v) {
  const t = tracks[i];
  t.vol = v;
  document.getElementById('n'+i).firstChild.nodeValue = v;

  // ボリューム変更時はインターバルをなしにリセット
  if (t.intv !== 0) {
    t.intv = 0;
    if (t.intvTimer) { clearTimeout(t.intvTimer); t.intvTimer = null; }
    document.getElementById('intv'+i).value = 0;
  }

  const cur = t.active==='a' ? t.a : t.b;
  if (v >= 1) {
    cur.volume = v / 100;
    if (cur.paused) { cur.currentTime=0; cur.play().catch(()=>{}); }
    document.getElementById('d'+i).style.display='inline';
    document.getElementById('r'+i).classList.add('playing');
  } else {
    if (t.fadeTimer) { clearInterval(t.fadeTimer); t.fadeTimer=null; }
    t.fading=false;
    t.a.pause(); t.a.currentTime=0; t.a.volume=0;
    t.b.pause(); t.b.currentTime=0; t.b.volume=0;
    t.active='a';
    document.getElementById('d'+i).style.display='none';
    document.getElementById('r'+i).classList.remove('playing');
  }
}

function setIntv(i, v) {
  const t = tracks[i];
  t.intv = v;
  if (t.intvTimer) { clearTimeout(t.intvTimer); t.intvTimer = null; }
  if (v === 0) {
    // インターバルなし → ループ再開
    const cur = t.active==='a' ? t.a : t.b;
    cur.volume = t.vol / 100;
    if (t.vol >= 1 && cur.paused) { cur.currentTime=0; cur.play().catch(()=>{}); }
    return;
  }
  // インターバル設定 → ループ止めて今すぐ1回再生
  playOnce(i);
}

build();
</script>

<!-- 空間エフェクトパネル -->
<div style="margin-top:32px;padding:16px;background:#1a1a1a;border-top:2px solid #333;">
  <div style="color:#7cf;font-size:14px;margin-bottom:16px;">🎧 空間エフェクト（全トラック共通）</div>
  <div style="color:#666;font-size:11px;margin-bottom:12px;">※ Web Audio APIを使用。スライダーを動かすと音声コンテキストが初期化されます。</div>

  <div id="fx-rows"></div>
  <button onclick="resetFx()" style="margin-top:14px;padding:8px 20px;background:#222;color:#aaa;border:1px solid #444;border-radius:6px;font-size:12px;cursor:pointer;">全リセット</button>
</div>

<script>
// エフェクト定義
const FX = [
  { id:'fx-x',      label:'x（左右）',    min:-1,   max:1,    step:0.01, def:0,    unit:'',   desc:'左←→右' },
  { id:'fx-z',      label:'z（距離）',    min:0,    max:20,   step:0.1,  def:1,    unit:'',   desc:'近い←→遠い' },
  { id:'fx-y',      label:'y（高さ）',    min:-5,   max:5,    step:0.1,  def:0,    unit:'',   desc:'下←→上' },
  { id:'fx-spread', label:'spread（広がり）', min:0, max:1,   step:0.01, def:0,    unit:'',   desc:'点←→面' },
  { id:'fx-filter', label:'filter（距離感）', min:200,max:20000,step:100, def:20000,unit:'Hz', desc:'こもり←→クリア' },
  { id:'fx-reverb', label:'reverb（空間）',   min:0, max:1,   step:0.01, def:0,    unit:'',   desc:'なし←→強' },
  { id:'fx-vel',    label:'velocity（動き）', min:0, max:10,  step:0.1,  def:0,    unit:'',   desc:'静止←→高速移動（x軸）' },
  { id:'fx-rand',   label:'random（揺らぎ）', min:0, max:1,   step:0.01, def:0,    unit:'',   desc:'なし←→大' },
  { id:'fx-dens',   label:'density（密度）',  min:0.5,max:3,  step:0.05, def:1,    unit:'x',  desc:'薄い←→密' },
];

// Web Audio APIセットアップ
let fxCtx = null, fxPanner = null, fxFilter = null, fxDryGain = null, fxWetGain = null, fxConvolver = null;
let velTimer = null, randTimer = null;
let fxState = {};
FX.forEach(f => { fxState[f.id] = f.def; });

function initFxCtx() {
  if (fxCtx) return;
  fxCtx = new (window.AudioContext || window.webkitAudioContext)();
  // チェーン: destination ← dryGain ← panner ← filter ← input
  //           destination ← wetGain ← convolver ← panner
  fxFilter   = fxCtx.createBiquadFilter();
  fxFilter.type = 'lowpass';
  fxFilter.frequency.value = 20000;

  fxPanner = fxCtx.createPanner();
  fxPanner.panningModel = 'HRTF';
  fxPanner.distanceModel = 'inverse';
  fxPanner.refDistance = 1;
  fxPanner.maxDistance = 20;
  fxPanner.positionX.value = 0;
  fxPanner.positionY.value = 0;
  fxPanner.positionZ.value = 1;

  fxDryGain = fxCtx.createGain(); fxDryGain.gain.value = 1;
  fxWetGain = fxCtx.createGain(); fxWetGain.gain.value = 0;
  fxConvolver = fxCtx.createConvolver();
  makeIR();

  fxFilter.connect(fxPanner);
  fxPanner.connect(fxDryGain); fxDryGain.connect(fxCtx.destination);
  fxPanner.connect(fxConvolver); fxConvolver.connect(fxWetGain); fxWetGain.connect(fxCtx.destination);

  // 既存のaudioを再接続
  tracks.forEach(t => {
    [t.a, t.b].forEach(audio => {
      try {
        const src = fxCtx.createMediaElementSource(audio);
        src.connect(fxFilter);
      } catch(e) {}
    });
  });
}

function makeIR(wet=0) {
  if (!fxCtx) return;
  const len = fxCtx.sampleRate * (0.5 + wet * 3);
  const buf = fxCtx.createBuffer(2, len, fxCtx.sampleRate);
  for (let c=0; c<2; c++) {
    const d = buf.getChannelData(c);
    for (let i=0; i<len; i++) {
      d[i] = (Math.random()*2-1) * Math.pow(1-i/len, 2-wet);
    }
  }
  fxConvolver.buffer = buf;
}

function buildFx() {
  const c = document.getElementById('fx-rows');
  FX.forEach(f => {
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;';
    row.innerHTML = `
      <div style="width:160px;font-size:12px;color:#aaa;">${f.label}</div>
      <input type="range" min="${f.min}" max="${f.max}" step="${f.step}" value="${f.def}" id="${f.id}"
        style="width:140px;accent-color:#f7a;" oninput="onFx('${f.id}',+this.value)">
      <span id="${f.id}-val" style="color:#f7a;font-size:12px;width:60px;">${f.def}${f.unit}</span>
      <span style="color:#555;font-size:11px;">${f.desc}</span>
    `;
    c.appendChild(row);
  });
}

function onFx(id, v) {
  fxState[id] = v;
  document.getElementById(id+'-val').textContent = v + (FX.find(f=>f.id===id).unit||'');
  initFxCtx();
  applyFx();
}

function applyFx() {
  if (!fxCtx) return;
  const x = fxState['fx-x'];
  const z = fxState['fx-z'];
  const y = fxState['fx-y'];
  const spread = fxState['fx-spread'];

  // 位置
  fxPanner.positionX.value = x * 5;
  fxPanner.positionZ.value = z;
  fxPanner.positionY.value = y;
  fxPanner.coneOuterAngle = 360 * (1 - spread * 0.5 + 0.5);

  // フィルター
  fxFilter.frequency.value = fxState['fx-filter'];

  // リバーブ
  fxWetGain.gain.value = fxState['fx-reverb'];
  fxDryGain.gain.value = 1 - fxState['fx-reverb'] * 0.5;
  makeIR(fxState['fx-reverb']);

  // velocity（x軸を往復移動）
  if (velTimer) { clearInterval(velTimer); velTimer=null; }
  const vel = fxState['fx-vel'];
  if (vel > 0) {
    let phase = 0;
    velTimer = setInterval(() => {
      phase += 0.05 * vel;
      fxPanner.positionX.value = Math.sin(phase) * 5;
      document.getElementById('fx-x-val').textContent = fxPanner.positionX.value.toFixed(2);
    }, 50);
  }

  // random（音量をゆらぐ）
  if (randTimer) { clearInterval(randTimer); randTimer=null; }
  const rand = fxState['fx-rand'];
  if (rand > 0) {
    randTimer = setInterval(() => {
      const jitter = 1 - rand * Math.random() * 0.3;
      fxDryGain.gain.value = (1 - fxState['fx-reverb'] * 0.5) * jitter;
    }, 200);
  }

  // density（再生速度で疑似密度）
  const dens = fxState['fx-dens'];
  tracks.forEach(t => {
    [t.a, t.b].forEach(audio => {
      try { audio.playbackRate = dens; } catch(e) {}
    });
  });
}

function resetFx() {
  FX.forEach(f => {
    fxState[f.id] = f.def;
    document.getElementById(f.id).value = f.def;
    document.getElementById(f.id+'-val').textContent = f.def + (f.unit||'');
  });
  if (velTimer) { clearInterval(velTimer); velTimer=null; }
  if (randTimer) { clearInterval(randTimer); randTimer=null; }
  if (fxCtx) {
    fxPanner.positionX.value = 0;
    fxPanner.positionZ.value = 1;
    fxPanner.positionY.value = 0;
    fxFilter.frequency.value = 20000;
    fxWetGain.gain.value = 0;
    fxDryGain.gain.value = 1;
    tracks.forEach(t => { [t.a,t.b].forEach(a=>{ try{a.playbackRate=1;}catch(e){} }); });
  }
}

buildFx();
</script>
</body>
</html>
