<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>音声テスト</title>
<style>
body { font-family: sans-serif; padding: 24px; background: #111; color: #eee; }
button { display: block; margin: 12px 0; padding: 16px 24px; font-size: 16px;
  background: #1a3a5a; color: #7cf; border: 1px solid #7cf; border-radius: 8px; cursor: pointer; width: 100%; }
button:active { background: #2a5a8a; }
#log { margin-top: 16px; font-size: 12px; color: #888; white-space: pre-wrap; }
</style>
</head>
<body>
<h2>音声再生テスト</h2>
<p style="color:#aaa;font-size:13px;margin-bottom:16px">ボタンを押して音が出るか確認</p>

<button onclick="test1()">▶ テスト1: asphalt v1 を再生</button>
<button onclick="test2()">▶ テスト2: thunder v1 を再生</button>
<button onclick="test3()">▶ テスト3: myedit mp3 を再生</button>
<button onclick="stopAll()">■ 全停止</button>

<div id="log">ログ：</div>

<script>
const audios = [];
function log(msg) {
  document.getElementById('log').textContent += '\n' + msg;
}

function play(url) {
  stopAll();
  const a = new Audio(url);
  a.loop = true;
  audios.push(a);
  log('再生試行: ' + url);
  a.play()
    .then(() => log('✓ 再生成功'))
    .catch(e => log('✗ エラー: ' + e.message));
  a.onerror = () => log('✗ ロードエラー: ' + (a.error ? a.error.code : '不明'));
}

function test1() { play('/rainmixerdebug/Firefly_audio_rain_hitting_asphalt_sound_variation1.wav'); }
function test2() { play('/rainmixerdebug/Firefly_audio_sound_of_thunder_variation1.wav'); }
function test3() { play('/rainmixerdebug/myedit_ai_sfx_0327082100.mp3'); }

function stopAll() {
  audios.forEach(a => { a.pause(); a.currentTime = 0; });
  audios.length = 0;
  log('-- 停止 --');
}
</script>
</body>
</html>
