<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>叫びWAOFOX</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5808591005205512" crossorigin="anonymous"></script>
<link rel="manifest" href="/waofox/waofox-manifest.json">
<meta name="theme-color" content="#1a1a1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="叫びWAOFOX">
<link rel="apple-touch-icon" href="/waofox/Gemini_Generated_Image_c7ubaec7ubaec7ub.png">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #f5f5f0; font-family: sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px 16px 48px; }
.top-nav { width: 100%; max-width: 600px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.btn-back { background: none; border: 1.5px solid #ccc; color: #555; font-size: 13px; padding: 7px 14px; border-radius: 8px; cursor: pointer; min-width: auto; flex: none; }
.btn-back:hover { border-color: #888; color: #222; }
.btn-pwa { background: none; border: 1.5px solid #3b6ef5; color: #3b6ef5; font-size: 13px; padding: 7px 14px; border-radius: 8px; cursor: pointer; min-width: auto; flex: none; }
.btn-pwa:hover { background: #eef0ff; }
h1 { font-size: 28px; color: #1a1a1a; margin-bottom: 4px; letter-spacing: 3px; }
.sub { font-size: 13px; color: #888; margin-bottom: 18px; }
.input-area { width: 100%; max-width: 600px; margin-bottom: 14px; display: flex; gap: 10px; }
.input-col { flex: 1; }
.input-label { font-size: 12px; color: #666; margin-bottom: 5px; }
input[type=text] {
  width: 100%; font-size: 16px; font-family: sans-serif;
  padding: 10px 12px; border: 2px solid #ccc; border-radius: 10px;
  outline: none; background: #fff; color: #1a1a1a;
}
input[type=text]:focus { border-color: #333; }
.char-hint { font-size: 12px; color: #aaa; text-align: right; margin-top: 4px; }
.canvas-wrap { width: 100%; max-width: 600px; border-radius: 12px; overflow: hidden; border: 1px solid #ddd; background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,0.1); }
canvas { width: 100%; display: block; }
.btn-row { display: flex; gap: 10px; margin-top: 14px; width: 100%; max-width: 600px; flex-wrap: wrap; }
button {
  flex: 1; min-width: 120px; padding: 13px; font-size: 15px; font-family: sans-serif;
  border-radius: 10px; cursor: pointer; transition: all 0.15s;
}
.btn-dl { background: #1a1a1a; color: #fff; border: none; }
.btn-dl:hover { background: #333; }
.btn-x { background: #000; color: #fff; border: none; }
.btn-x:hover { background: #222; }
.toast {
  position: fixed; bottom: 32px; left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: #1a1a1a; color: #fff; padding: 12px 24px;
  border-radius: 8px; font-size: 14px;
  opacity: 0; transition: all 0.2s; pointer-events: none; z-index: 200;
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="top-nav">
  <button class="btn-back" onclick="location.href='/'">← TOPに戻る</button>
  <button class="btn-pwa" id="btnPwa" onclick="installPwa()">＋ ホーム画面に追加</button>
</div>
<h1>叫びWAOFOX</h1>
<p class="sub">WAOFOXに叫ばせよう</p>
<div class="input-area">
  <div class="input-col">
    <div class="input-label">左のコ（元気）</div>
    <input type="text" id="txt1" maxlength="30" placeholder="叫ばせたい言葉…" oninput="draw()">
    <div class="char-hint" id="cnt1">0 / 30</div>
  </div>
  <div class="input-col">
    <div class="input-label">右のコ（不機嫌）</div>
    <input type="text" id="txt2" maxlength="30" placeholder="叫ばせたい言葉…" oninput="draw()">
    <div class="char-hint" id="cnt2">0 / 30</div>
  </div>
</div>
<div class="canvas-wrap">
  <canvas id="c"></canvas>
</div>
<div class="btn-row">
  <button class="btn-dl" onclick="dl()">💾 画像を保存</button>
  <button class="btn-x" onclick="shareX()">𝕏 Xでシェア</button>
</div>

<div class="toast" id="toast"></div>

<script>
const img = new Image();
let ready = false;
img.onload = () => { ready = true; autoDetectBubbles(); };
img.src = '/waofox/Gemini_Generated_Image_c7ubaec7ubaec7ub.png';

// 吹き出し位置（autoDetectBubblesで上書きされる）
const BUBBLE1 = { cx: 0.26, cy: 0.21, w: 0.44, h: 0.36 };
const BUBBLE2 = { cx: 0.74, cy: 0.21, w: 0.44, h: 0.36 };

function autoDetectBubbles() {
  // 解析用に縮小してピクセルデータ取得
  const SCALE = 0.25;
  const W = img.naturalWidth, H = img.naturalHeight;
  const AW = Math.floor(W * SCALE), AH = Math.floor(H * SCALE);
  const oc = document.createElement('canvas');
  oc.width = AW; oc.height = AH;
  const ox = oc.getContext('2d');
  ox.drawImage(img, 0, 0, AW, AH);
  const d = ox.getImageData(0, 0, AW, AH).data;

  const isDark = (x, y) => {
    const i = (y * AW + x) * 4;
    return (0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]) < 120;
  };

  // 長い連続ダーク区間を持つ行・列からバウンディングボックスを検出
  function detectBubble(ax0, ax1) {
    const ay1 = Math.floor(AH * 0.52); // 上半分のみスキャン
    const minHRun = Math.max(4, Math.floor((ax1 - ax0) * 0.12));
    const minVRun = Math.max(3, Math.floor(ay1 * 0.10));

    // 上下端：水平方向の長い連続
    let topY = ay1, bottomY = 0;
    for (let y = 0; y < ay1; y++) {
      let run = 0, maxRun = 0;
      for (let x = ax0; x < ax1; x++) {
        if (isDark(x, y)) { run++; maxRun = Math.max(maxRun, run); }
        else run = 0;
      }
      if (maxRun >= minHRun) {
        if (y < topY) topY = y;
        if (y > bottomY) bottomY = y;
      }
    }

    // 左右端：垂直方向の長い連続（topY～bottomY内）
    let leftX = ax1, rightX = ax0;
    for (let x = ax0; x < ax1; x++) {
      let run = 0, maxRun = 0;
      for (let y = topY; y <= bottomY; y++) {
        if (isDark(x, y)) { run++; maxRun = Math.max(maxRun, run); }
        else run = 0;
      }
      if (maxRun >= minVRun) {
        if (x < leftX) leftX = x;
        if (x > rightX) rightX = x;
      }
    }

    // 実座標（0〜1）に変換
    return {
      cx: ((leftX + rightX) / 2) / AW,
      cy: ((topY + bottomY) / 2) / AH,
      w:  (rightX - leftX) / AW,
      h:  (bottomY - topY) / AH
    };
  }

  const midX = Math.floor(AW / 2);
  Object.assign(BUBBLE1, detectBubble(0, midX));
  Object.assign(BUBBLE2, detectBubble(midX, AW));
  draw();
}

function drawBubbleText(ctx, txt, bubble, CW, CH) {
  if (!txt) return;
  const bcx = CW * bubble.cx;
  const bcy = CH * bubble.cy;
  const bw  = CW * bubble.w * 0.80;
  const bh  = CH * bubble.h * 0.70;
  const lines = splitLines(txt, bw, bh, ctx);
  const lh = lines.fs * 1.25;
  const totalH = lh * lines.arr.length;
  ctx.font = `bold ${lines.fs}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  lines.arr.forEach((line, i) => {
    const y = bcy - totalH/2 + lh*i + lh/2;
    ctx.lineWidth = lines.fs * 0.12;
    ctx.strokeStyle = '#fff';
    ctx.strokeText(line, bcx, y);
    ctx.fillStyle = '#111';
    ctx.fillText(line, bcx, y);
  });
}

function draw() {
  const txt1 = document.getElementById('txt1').value;
  const txt2 = document.getElementById('txt2').value;
  document.getElementById('cnt1').textContent = txt1.length + ' / 30';
  document.getElementById('cnt2').textContent = txt2.length + ' / 30';
  savedFlag = false;
  if (!ready) return;
  const CW = 600;
  const CH = Math.round(CW * img.naturalHeight / img.naturalWidth);
  const c = document.getElementById('c');
  c.width = CW; c.height = CH;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, CW, CH);
  ctx.drawImage(img, 0, 0, CW, CH);
  drawBubbleText(ctx, txt1, BUBBLE1, CW, CH);
  drawBubbleText(ctx, txt2, BUBBLE2, CW, CH);
}

function splitLines(txt, maxW, maxH, ctx) {
  for (let fs = 60; fs >= 18; fs -= 3) {
    ctx.font = `bold ${fs}px sans-serif`;
    const lh = fs * 1.25;
    if (ctx.measureText(txt).width <= maxW && lh <= maxH) return { arr: [txt], fs };
    const m = Math.ceil(txt.length/2);
    const l1 = txt.slice(0,m), l2 = txt.slice(m);
    if (Math.max(ctx.measureText(l1).width, ctx.measureText(l2).width) <= maxW && lh*2 <= maxH) return { arr: [l1,l2], fs };
    const a = Math.ceil(txt.length/3);
    const r1=txt.slice(0,a), r2=txt.slice(a,a*2), r3=txt.slice(a*2);
    if (Math.max(ctx.measureText(r1).width,ctx.measureText(r2).width,ctx.measureText(r3).width) <= maxW && lh*3 <= maxH) return { arr:[r1,r2,r3], fs };
  }
  return { arr:[txt.slice(0,15)+'…'], fs:18 };
}

let savedFlag = false;

let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
});
function installPwa() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(() => { deferredPrompt = null; });
  } else {
    toast('ブラウザの右上メニュー →「ホーム画面に追加」から追加してね');
  }
}
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/waofox/waofox-sw.js');
}

function dl() {
  draw();
  const link = document.createElement('a');
  link.download = 'waofox-scream.png';
  link.href = document.getElementById('c').toDataURL('image/png');
  link.click();
  savedFlag = true;
}

function shareX() {
  if (!savedFlag) {
    dl();
    setTimeout(() => openX(), 400);
  } else {
    openX();
  }
}

function openX() {
  const url = 'https://x.com/intent/tweet?text=' + encodeURIComponent('#叫びWAOFOX');
  window.open(url, '_blank');
  toast('ダウンロードした画像をXに添付してね');
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3000);
}
</script>
</body>
</html>
