<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>SmartSuffix</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: sans-serif;
      padding: 16px;
      background: #f5f5f5;
    }
    textarea {
      width: 100%;
      height: 120px;
      margin-bottom: 8px;
      padding: 8px;
    }
    .row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }
    button, label {
      flex: 1;
    }
  </style>
</head>
<body>

<h2>SmartSuffix</h2>

<textarea id="input" placeholder="テキスト入力"></textarea>

<div class="row">
  <label><input type="checkbox" id="timestamp">日時</label>
  <label><input type="checkbox" id="hashtag">#タグ</label>
  <label><input type="checkbox" id="bullet">箇条</label>
</div>

<div class="row">
  <label><input type="checkbox" id="linebreak">改行</label>
  <label><input type="checkbox" id="quote">引用</label>
  <label><input type="checkbox" id="template">自由</label>
</div>

<textarea id="output" placeholder="変換結果"></textarea>

<div class="row">
  <button onclick="copyText()">コピー</button>
  <button onclick="resetText()">リセット</button>
</div>

<script>
const input = document.getElementById("input");
const output = document.getElementById("output");

const checkboxes = document.querySelectorAll("input[type=checkbox]");
checkboxes.forEach(cb => cb.addEventListener("change", apply));

input.addEventListener("input", apply);

function apply() {
  let text = input.value;

  // 改行
  if (linebreak.checked) {
    text = text.replace(/\s+/g, "\n");
  }

  // タイムスタンプ
  if (timestamp.checked) {
    const now = new Date();
    const t = now.toLocaleString("ja-JP");
    text = t + "\n" + text;
  }

  // ハッシュタグ
  if (hashtag.checked) {
    text = text.split("\n").map(line =>
      line.split(/\s+/).map(w => "#" + w).join(" ")
    ).join("\n");
  }

  // 箇条書き
  if (bullet.checked) {
    text = text.split("\n").map(line => "・" + line).join("\n");
  }

  // 引用
  if (quote.checked) {
    text = text.split("\n").map(line => "> " + line).join("\n");
  }

  // テンプレ
  if (template.checked) {
    const tpl = "[TEXT]";
    text = tpl.replace("[TEXT]", text);
  }

  output.value = text;
}

function copyText() {
  navigator.clipboard.writeText(output.value);
  alert("コピーした");
}

function resetText() {
  output.value = input.value;
  checkboxes.forEach(cb => cb.checked = false);
}
</script>

</body>
</html>
